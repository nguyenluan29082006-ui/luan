version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: webdoctruyen-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: webdoctruyen-frontend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - BackendApi__BaseUrl=http://backend:5000
    depends_on:
      - backend
